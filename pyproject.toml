[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nautobot-app-ssot-lantronix"
version = "0.1.0"
description = "Nautobot SSoT integration that syncs Lantronix console servers, console ports and attached devices from Percepxion."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10,<3.15"
dependencies = [
    "nautobot>=3.1,<4.0",
    "nautobot-ssot>=4.8,<5",
    "requests>=2.31",
]

[project.urls]
Repository = "https://github.com/Lantronix/nautobot-app-ssot-lantronix"
Changelog = "https://github.com/Lantronix/nautobot-app-ssot-lantronix/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# Console paths in ServiceNow; core installs don't need it.
servicenow = ["nautobot-ssot[servicenow]>=4.8,<5"]

[tool.setuptools.packages.find]
include = ["nautobot_ssot_lantronix*"]

[tool.setuptools.package-data]
nautobot_ssot_lantronix = ["tests/fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["nautobot_ssot_lantronix/tests"]
# Nautobot-backed tests run with `nautobot-server test` in the dev stack.
addopts = "--ignore=nautobot_ssot_lantronix/tests/test_target_adapter.py --ignore=nautobot_ssot_lantronix/tests/test_servicenow_console_paths.py"

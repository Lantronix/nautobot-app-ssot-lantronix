# Nautobot with nautobot-ssot and this app. Run from the docker directory.
# The project name keeps these containers and volumes apart from any other Nautobot on the host.
name: nautobot-lantronix

x-nautobot: &nautobot
  image: nautobot-lantronix:local
  pull_policy: never
  env_file: .env
  environment: &environment
    NAUTOBOT_DB_HOST: db
    NAUTOBOT_DB_NAME: nautobot
    NAUTOBOT_DB_USER: nautobot
    NAUTOBOT_REDIS_HOST: redis
    NAUTOBOT_CONFIG: /opt/nautobot/nautobot_config.py
  volumes:
    - ./nautobot_config.py:/opt/nautobot/nautobot_config.py:ro
  restart: unless-stopped

services:
  nautobot:
    <<: *nautobot
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "127.0.0.1:${NAUTOBOT_PORT:-8080}:8080"
    environment:
      <<: *environment
      NAUTOBOT_CREATE_SUPERUSER: "true"
      NAUTOBOT_SUPERUSER_NAME: admin
    volumes:
      - ./nautobot_config.py:/opt/nautobot/nautobot_config.py:ro
      - .:/opt/nautobot-lantronix:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    # The first start runs every migration, which can take several minutes.
    healthcheck:
      start_period: 900s
      timeout: 30s
  worker:
    <<: *nautobot
    entrypoint: ["nautobot-server", "celery", "worker", "-l", "INFO"]
    healthcheck:
      disable: true
    depends_on:
      nautobot:
        condition: service_healthy
  beat:
    <<: *nautobot
    entrypoint: ["nautobot-server", "celery", "beat", "-l", "INFO"]
    healthcheck:
      disable: true
    depends_on:
      nautobot:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nautobot
      POSTGRES_USER: nautobot
      POSTGRES_PASSWORD: ${NAUTOBOT_DB_PASSWORD:?set NAUTOBOT_DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nautobot -d nautobot"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  db-data:

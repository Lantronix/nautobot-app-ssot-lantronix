{% for path in paths %}
<a href="ssh://{{ path.ssh_target }}" class="btn btn-primary" rel="noopener noreferrer" title="SSH to {{ path.ssh_target }}: {{ path.server_port.device }} {{ path.server_port.name }}"><span class="mdi mdi-console" aria-hidden="true"></span> Open console{% if several %} ({{ path.console_port.name }}){% endif %}</a>
{% endfor %}
